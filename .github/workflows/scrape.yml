name: Auto Stock Close Report

on:
  schedule:
    - cron: '12 21 * * 0-4'  # 台北週一~週五 05:12（UTC 週日~週四對應台北週一~週五）
    - cron: '12 23 * * 0-4'  # 台北週一~週五 07:12
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-close-report
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore fallback cache
        uses: actions/cache@v4
        with:
          path: cache
          key: stock-close-cache-${{ github.run_id }}
          restore-keys: |
            stock-close-cache-

      - name: Run scraper
        run: python "main.py"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_close_report.txt reports/
          git diff --staged --quiet || git commit -m "Auto update close price report ($(date +'%Y-%m-%d %H:%M %Z'))"
          git push
